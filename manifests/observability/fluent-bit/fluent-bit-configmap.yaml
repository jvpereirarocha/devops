# Fluent Bit pipeline: tail the container log files of the fintracker API and bot and of
# RabbitMQ, join multi-line records (Python tracebacks, RabbitMQ crash reports), turn the API's JSON
# request lines into columns, add Kubernetes metadata and ship each app to its own
# OpenObserve stream.
# Fluent Bit does not reload this file on its own: after changing it run
#   kubectl rollout restart daemonset/fluent-bit -n observability
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
data:
  fluent-bit.yaml: |
    service:
      flush: 2
      log_level: info
      http_server: on
      http_listen: 0.0.0.0
      http_port: 2020
      health_check: on
      # Buffer chunks on disk so logs survive an OpenObserve restart or a Fluent Bit restart.
      storage.path: /var/lib/fluent-bit/storage
      storage.sync: normal
      storage.backlog.mem_limit: 5M

    parsers:
      # The API's request logging middleware writes one JSON object per line
      - name: json_log
        format: json

    multiline_parsers:
      # A record starts with a timestamp (Python logging "2026-01-01 10:00:00,123 [ERROR] ...",
      # RabbitMQ "2026-01-01 10:00:00.123456+00:00 [info] ..."),
      # a uvicorn level prefix ("INFO:     ...") or a JSON object ("{"event": "request", ...}").
      # Any other line (traceback frames, blank lines, "The above exception..." and the
      # exception line) belongs to the previous record.
      - name: python_app
        type: regex
        flush_timeout: 1000
        rules:
          - state: start_state
            regex: '/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}|[A-Z]+:\s|\{)/'
            next_state: cont
          - state: cont
            regex: '/^(?!\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}|[A-Z]+:\s|\{)/'
            next_state: cont

    pipeline:
      inputs:
        # Pod log file names are <pod>_<namespace>_<container>-<id>.log. The globs depend on
        # the Deployment names: update them if a Deployment is renamed.
        - name: tail
          tag: kube.api.*
          path: /var/log/containers/fintracker-deployment-*_fintracker-dev_*.log
          multiline.parser: cri
          db: /var/lib/fluent-bit/tail-api.db
          read_from_head: true
          refresh_interval: 10
          skip_long_lines: on
          storage.type: filesystem

        - name: tail
          tag: kube.bot.*
          path: /var/log/containers/fintracker-bot-deployment-*_fintracker-dev_*.log
          multiline.parser: cri
          db: /var/lib/fluent-bit/tail-bot.db
          read_from_head: true
          refresh_interval: 10
          skip_long_lines: on
          storage.type: filesystem

        # RabbitMQ StatefulSet pods are rabbitmq-<ordinal>.
        - name: tail
          tag: kube.rabbitmq.*
          path: /var/log/containers/rabbitmq-*_messaging_rabbitmq-*.log
          multiline.parser: cri
          db: /var/lib/fluent-bit/tail-rabbitmq.db
          read_from_head: true
          refresh_interval: 10
          skip_long_lines: on
          storage.type: filesystem

      filters:
        - name: multiline
          match: kube.*
          multiline.key_content: log
          multiline.parser: python_app
          emitter_storage.type: filesystem

        # JSON request lines become columns (route, status, duration_ms, request_id...).
        # Lines that are not JSON (startup messages, tracebacks) fail to parse and pass through
        # unchanged with their "log" field.
        - name: parser
          match: kube.api.*
          key_name: log
          parser: json_log
          reserve_data: on

        - name: kubernetes
          match: kube.api.*
          kube_tag_prefix: kube.api.var.log.containers.
          buffer_size: 0
          labels: on
          annotations: off

        - name: kubernetes
          match: kube.bot.*
          kube_tag_prefix: kube.bot.var.log.containers.
          buffer_size: 0
          labels: on
          annotations: off

        - name: kubernetes
          match: kube.rabbitmq.*
          kube_tag_prefix: kube.rabbitmq.var.log.containers.
          buffer_size: 0
          labels: on
          annotations: off

      outputs:
        - name: http
          match: kube.api.*
          host: openobserve.observability.svc.cluster.local
          port: 5080
          uri: /api/default/fintracker_api/_json
          format: json
          json_date_key: _timestamp
          json_date_format: iso8601
          http_user: ${OPENOBSERVE_USER}
          http_passwd: ${OPENOBSERVE_TOKEN}
          compress: gzip
          retry_limit: 10
          storage.total_limit_size: 256M

        - name: http
          match: kube.bot.*
          host: openobserve.observability.svc.cluster.local
          port: 5080
          uri: /api/default/fintracker_bot/_json
          format: json
          json_date_key: _timestamp
          json_date_format: iso8601
          http_user: ${OPENOBSERVE_USER}
          http_passwd: ${OPENOBSERVE_TOKEN}
          compress: gzip
          retry_limit: 10
          storage.total_limit_size: 256M

        - name: http
          match: kube.rabbitmq.*
          host: openobserve.observability.svc.cluster.local
          port: 5080
          uri: /api/default/rabbitmq/_json
          format: json
          json_date_key: _timestamp
          json_date_format: iso8601
          http_user: ${OPENOBSERVE_USER}
          http_passwd: ${OPENOBSERVE_TOKEN}
          compress: gzip
          retry_limit: 10
          storage.total_limit_size: 256M
