# One Fluent Bit pod per node reads the container log files from the host.
# The OpenObserve credentials come from the fluent-bit-openobserve Secret (an OpenObserve
# service account, not the admin user), created outside git:
#   kubectl create secret generic fluent-bit-openobserve -n observability \
#     --from-literal=OPENOBSERVE_USER=<SERVICE_ACCOUNT_EMAIL> \
#     --from-literal=OPENOBSERVE_TOKEN=<SERVICE_ACCOUNT_TOKEN>
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: observability
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          args: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
          ports:
            - name: http
              containerPort: 2020
          envFrom:
            - secretRef:
                name: fluent-bit-openobserve
          # Runs as root: the log files under /var/log/pods are readable only by root.
          # Everything else is locked down.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/fluent-bit
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        # File offsets (tail db) and the on-disk buffer survive pod restarts here.
        - name: state
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate
