# Traefik ingress for the ArgoCD UI/API.
# argocd-server runs with server.insecure=true, so Traefik talks plain HTTP to port 80.
# Point argocd.local to the Traefik LoadBalancer IP (192.168.18.2) in /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
