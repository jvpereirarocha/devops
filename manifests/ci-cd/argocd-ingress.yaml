# Traefik ingress for the ArgoCD UI/API.
# argocd-server runs with server.insecure=true, so Traefik talks plain HTTP to port 80.
# Both hosts point to the Traefik LoadBalancer IP (192.168.18.2):
#   - argocd.local.lan: DNS record on the router (192.168.18.1), works on every LAN device.
#                       This is the link used by the homepage dashboard.
#   - argocd.local:     /etc/hosts entry on the admin machine (used by the argocd CLI login).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.local.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
